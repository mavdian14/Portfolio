# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: app/db/migrations/env.py reads DATABASE_URL
# from app.config.Settings, so there is exactly one source of truth for the
# connection string and no chance of a migration running against a stale URL.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
