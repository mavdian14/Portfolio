[project]
name = "exception-desk"
version = "0.1.0"
description = "An LLM-backed triage service for supply-chain exceptions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

# Provider SDKs are optional extras: the service runs fully against the mock provider
# with neither installed, which is what CI and the test suite rely on.
[project.optional-dependencies]
anthropic = ["anthropic>=2.1.0"]
openai = ["openai>=3.19.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Make `app` importable without requiring `pip install -e .` first, so a fresh clone can
# run the suite immediately.
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
