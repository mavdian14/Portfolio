name: exception-desk

# The api and worker share one image and differ only in their command, so the
# promoted domain and llm packages cannot drift between them.

x-app: &app
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://exception_desk:exception_desk@db:5432/exception_desk
  volumes:
    - ./app:/srv/app:ro
    - ./alembic.ini:/srv/alembic.ini:ro
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: exception_desk
      POSTGRES_PASSWORD: exception_desk
      POSTGRES_DB: exception_desk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Extension provisioning is an infrastructure concern, so it lives here and
      # not in an Alembic migration. pgvector is present and unused until M2.
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exception_desk -d exception_desk"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Week 2. Present here so the compose file is the finished shape and the
  # worker is a one-line change to enable.
  worker:
    <<: *app
    command: ["python", "-m", "app.pipeline.worker"]
    profiles: ["worker"]
    healthcheck:
      disable: true

volumes:
  db_data:
